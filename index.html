<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPM Property Management</title>
<meta name="description" content="EPM Property Management provides professional management of multifamily and retail real estate.">
<style>
  :root {
    --bg: #f6f4ef;
    --ink: #1c2a26;
    --muted: #5d6b66;
    --rule: #c9c3b4;
    --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a18;
      --ink: #eeeae0;
      --muted: #a3ada8;
      --rule: #33413c;
      --accent: #8fbfae;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  .mark {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 28px;
  }
  h1 {
    font-size: clamp(2.2rem, 7vw, 4.25rem);
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: var(--rule);
    border: 0;
    margin: 36px auto;
  }
  p.lede {
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    line-height: 1.55;
    color: var(--muted);
    color: var(--ink);
    max-width: 34ch;
    margin: 0;
    text-wrap: balance;
  }
  p.body {
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    line-height: 1.65;
    color: var(--muted);
    max-width: 46ch;
    margin: 20px 0 0;
    text-wrap: pretty;
  }
  footer {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
  <main>
    <p class="mark">EPM</p>
    <h1>EPM Property Management</h1>
    <hr class="rule">
    <p class="lede">Professional management of multifamily and retail real estate.</p>
    <p class="body">Our team oversees leasing, maintenance, and day-to-day operations across our portfolio, with a commitment to well-run properties and lasting value.</p>
  </main>
  <footer>&copy; <span id="y">2026</span> EPM Property Management</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
